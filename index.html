<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DompetKu</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DompetKu">
    <meta name="theme-color" content="#f9fafb">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <!-- HALAMAN LOGIN -->
    <div id="auth-view" class="min-h-screen flex flex-col items-center justify-center p-5">
        <div class="bg-white max-w-sm w-full rounded-3xl shadow-sm border border-gray-100 p-8">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-gray-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md transform rotate-3">
                    <svg class="w-7 h-7 -rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Masuk DompetKu</h1>
                <p class="text-sm text-gray-500 mt-2">Masukkan nama dan kata sandi Anda</p>
            </div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <input type="text" id="username" required class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition-all text-sm font-medium" placeholder="Nama Anda (Misal: Budi)">
                </div>
                <div>
                    <input type="password" id="password" required class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition-all text-sm font-medium" placeholder="Kata Sandi">
                </div>
                <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-3.5 rounded-xl transition-all shadow-md hover:shadow-lg mt-2">
                    Masuk / Daftar
                </button>
            </form>
        </div>
        <p class="text-xs text-gray-400 mt-8 font-medium tracking-wide">by Sendi Lukman</p>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboard-view" class="hidden max-w-md mx-auto min-h-screen bg-gray-50 pb-24 shadow-2xl relative overflow-hidden">
        <div class="bg-white/90 backdrop-blur-md px-6 py-4 flex items-center justify-between sticky top-0 z-20 border-b border-gray-100 pt-12">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gray-900 text-white flex items-center justify-center font-bold text-lg shadow-sm" id="avatar-initial">A</div>
                <div>
                    <h1 class="font-bold text-gray-900 leading-tight">DompetKu</h1>
                    <p class="text-xs text-gray-500 font-medium">Halo, <span id="display-name" class="text-gray-800 font-semibold">User</span>!</p>
                </div>
            </div>
            <button id="logout-btn" class="w-9 h-9 rounded-full bg-gray-50 text-gray-600 hover:bg-gray-200 flex items-center justify-center transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>

        <div class="p-5 space-y-5">
            <div class="bg-gradient-to-br from-gray-800 to-black rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                <p class="text-sm text-gray-300 mb-1 font-medium relative z-10">Total Pengeluaran Bulanan</p>
                <h2 class="text-4xl font-extrabold mb-4 relative z-10 tracking-tight" id="total-bulan">Rp0</h2>
                <div class="inline-block bg-white/20 backdrop-blur-sm px-3 py-1 rounded-lg relative z-10">
                    <p class="text-xs text-white font-medium" id="bulan-text">Bulan: -</p>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-bold text-gray-800">Anggaran Mingguan</h3>
                    <button id="btn-set-budget" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1.5 rounded-lg font-medium transition-colors">Atur Target</button>
                </div>
                <div id="form-budget" class="hidden mb-4 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                    <label class="text-xs text-gray-500 font-medium block mb-2">Target Pengeluaran (Senin-Minggu)</label>
                    <div class="flex gap-2">
                        <input type="text" inputmode="numeric" id="input-budget" class="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gray-900 bg-white" placeholder="Contoh: 300000">
                        <button id="btn-save-budget" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-black">Simpan</button>
                    </div>
                </div>
                <div class="flex items-end gap-2 mb-2">
                    <h2 class="text-2xl font-bold text-gray-900" id="text-budget-spent">Rp0</h2>
                    <span class="text-xs font-medium text-gray-500 mb-1" id="text-budget-status">/ Rp0</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2.5 mb-2 overflow-hidden">
                    <div id="budget-progress" class="bg-gray-900 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p class="text-xs font-medium text-gray-400 text-right" id="text-budget-sisa">Tersisa: Rp0</p>
            </div>

            <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm">
                <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2 mb-4">Tambah Pengeluaran</h3>
                <form id="form-pengeluaran" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5">Nominal (Rp)</label>
                        <input type="text" inputmode="numeric" id="nominal" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white text-sm font-semibold" placeholder="Contoh: 15000">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5">Kategori / Keterangan</label>
                        <div class="flex flex-wrap gap-2 mb-3" id="kategori-container">
                            <button type="button" class="btn-kat bg-white border border-gray-200 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-medium" data-val="Makan & Minum">🍔 Makan & Minum</button>
                            <button type="button" class="btn-kat bg-white border border-gray-200 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-medium" data-val="Transportasi">🚗 Transportasi</button>
                            <button type="button" class="btn-kat bg-white border border-gray-200 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-medium" data-val="Belanja">🛍️ Belanja</button>
                            <button type="button" class="btn-kat bg-white border border-gray-200 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-medium" data-val="Tagihan">🧾 Tagihan</button>
                            <button type="button" class="btn-kat bg-white border border-gray-200 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-medium" data-val="Hiburan">🍿 Hiburan</button>
                        </div>
                        <input type="text" id="keterangan" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm" placeholder="Ketik atau pilih kategori di atas...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5">Tanggal</label>
                        <input type="date" id="tanggal" required class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm text-gray-700">
                    </div>
                    <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-3.5 rounded-xl transition-colors mt-2 shadow-md">
                        Simpan Catatan
                    </button>
                </form>
            </div>

            <div class="mt-8">
                <h3 class="text-sm font-bold text-gray-800 mb-4 px-1">Riwayat Pengeluaran</h3>
                <div id="daftar-riwayat" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let expenses = [];
        let weeklyBudget = 0;

        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const logoutBtn = document.getElementById('logout-btn');
        const displayName = document.getElementById('display-name');
        const avatarInitial = document.getElementById('avatar-initial');
        const totalBulanEl = document.getElementById('total-bulan');
        const bulanTextEl = document.getElementById('bulan-text');
        const daftarRiwayatEl = document.getElementById('daftar-riwayat');
        const formPengeluaran = document.getElementById('form-pengeluaran');
        const btnSetBudget = document.getElementById('btn-set-budget');
        const formBudget = document.getElementById('form-budget');
        const inputBudget = document.getElementById('input-budget');
        const btnSaveBudget = document.getElementById('btn-save-budget');
        const textBudgetSpent = document.getElementById('text-budget-spent');
        const textBudgetStatus = document.getElementById('text-budget-status');
        const budgetProgress = document.getElementById('budget-progress');
        const textBudgetSisa = document.getElementById('text-budget-sisa');
        const inputKeterangan = document.getElementById('keterangan');
        const btnKategoris = document.querySelectorAll('.btn-kat');

        document.getElementById('tanggal').valueAsDate = new Date();

        function checkAuth() {
            const loggedInUser = localStorage.getItem('dompetku_current_user');
            if (loggedInUser) {
                currentUser = loggedInUser;
                showDashboard();
                loadUserData();
            } else {
                showAuth();
            }
        }

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            if(!name || !pass) return;

            let users = JSON.parse(localStorage.getItem('dompetku_users') || '{}');
            if (users[name]) {
                if (users[name] !== pass) {
                    alert('Kata sandi salah!');
                    return;
                }
            } else {
                users[name] = pass;
                localStorage.setItem('dompetku_users', JSON.stringify(users));
            }
            localStorage.setItem('dompetku_current_user', name);
            checkAuth();
        });

        logoutBtn.addEventListener('click', () => {
            if(confirm('Yakin ingin keluar?')) {
                localStorage.removeItem('dompetku_current_user');
                currentUser = null;
                authForm.reset();
                checkAuth();
            }
        });

        function showAuth() {
            authView.classList.remove('hidden');
            dashboardView.classList.add('hidden');
        }

        function showDashboard() {
            authView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
            displayName.textContent = currentUser;
            avatarInitial.textContent = currentUser.charAt(0).toUpperCase();
        }

        function getStorageKey(key) { return `dompetku_${currentUser}_${key}`; }

        function loadUserData() {
            expenses = JSON.parse(localStorage.getItem(getStorageKey('expenses')) || '[]');
            weeklyBudget = parseInt(localStorage.getItem(getStorageKey('budget')) || '0');
            renderApp();
        }

        function saveExpenses() {
            localStorage.setItem(getStorageKey('expenses'), JSON.stringify(expenses));
            renderApp();
        }

        function saveBudget(amount) {
            weeklyBudget = amount;
            localStorage.setItem(getStorageKey('budget'), amount.toString());
            formBudget.classList.add('hidden');
            renderApp();
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        function cleanNumber(str) {
            return parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
        }

        function getStartAndEndOfWeek() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const numDay = dayOfWeek === 0 ? 6 : dayOfWeek - 1; 
            const start = new Date(now);
            start.setDate(now.getDate() - numDay);
            start.setHours(0,0,0,0);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            end.setHours(23,59,59,999);
            return { start, end };
        }

        function resetKategori() {
            btnKategoris.forEach(b => {
                b.classList.remove('bg-gray-900', 'text-white', 'border-gray-900');
                b.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
            });
        }

        btnKategoris.forEach(btn => {
            btn.addEventListener('click', () => {
                resetKategori();
                btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
                btn.classList.add('bg-gray-900', 'text-white', 'border-gray-900');
                inputKeterangan.value = btn.getAttribute('data-val');
            });
        });

        inputKeterangan.addEventListener('input', resetKategori);

        function renderApp() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            bulanTextEl.textContent = `Bulan: ${monthNames[currentMonth]} ${currentYear}`;

            let totalBulanIni = 0;
            let pengeluaranMingguIni = 0;
            const { start: startOfWeek, end: endOfWeek } = getStartAndEndOfWeek();

            expenses.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
            const grouped = {};

            expenses.forEach(exp => {
                const dateObj = new Date(exp.tanggal);
                if (dateObj.getMonth() === currentMonth && dateObj.getFullYear() === currentYear) {
                    totalBulanIni += exp.nominal;
                }
                if (dateObj >= startOfWeek && dateObj <= endOfWeek) {
                    pengeluaranMingguIni += exp.nominal;
                }
                if (!grouped[exp.tanggal]) grouped[exp.tanggal] = { total: 0, items: [] };
                grouped[exp.tanggal].items.push(exp);
                grouped[exp.tanggal].total += exp.nominal;
            });

            totalBulanEl.textContent = formatRupiah(totalBulanIni);
            textBudgetSpent.textContent = formatRupiah(pengeluaranMingguIni);
            textBudgetStatus.textContent = `/ ${formatRupiah(weeklyBudget)}`;
            
            let percentage = 0;
            if (weeklyBudget > 0) {
                percentage = (pengeluaranMingguIni / weeklyBudget) * 100;
                if(percentage > 100) percentage = 100;
            }
            budgetProgress.style.width = percentage + '%';
            budgetProgress.className = 'h-2.5 rounded-full transition-all duration-500 ' + 
                (percentage > 90 ? 'bg-red-500' : percentage > 75 ? 'bg-yellow-500' : 'bg-gray-900');

            if (weeklyBudget > 0) {
                const sisa = weeklyBudget - pengeluaranMingguIni;
                if (sisa < 0) {
                    textBudgetSisa.textContent = `Overbudget: ${formatRupiah(Math.abs(sisa))}`;
                    textBudgetSisa.className = 'text-xs font-medium text-red-500 text-right';
                } else {
                    textBudgetSisa.textContent = `Tersisa: ${formatRupiah(sisa)}`;
                    textBudgetSisa.className = 'text-xs font-medium text-gray-400 text-right';
                }
            } else {
                textBudgetSisa.textContent = 'Target belum diatur';
            }

            daftarRiwayatEl.innerHTML = '';
            for (const [tgl, data] of Object.entries(grouped)) {
                const dateObj = new Date(tgl);
                const formatTgl = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl border border-gray-100 overflow-hidden shadow-sm';
                
                let itemsHTML = '';
                data.items.forEach(item => {
                    itemsHTML += `
                        <div class="flex justify-between items-center p-4 border-b border-gray-50 last:border-0 transition-colors group">
                            <div>
                                <p class="font-semibold text-gray-800 text-sm">${item.keterangan}</p>
                                <p class="text-xs text-gray-400 font-medium">${formatRupiah(item.nominal)}</p>
                            </div>
                            <button onclick="hapusPengeluaran('${item.id}')" class="text-red-400 bg-red-50 p-2 rounded-lg">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="bg-gray-50/50 px-4 py-3 flex justify-between items-center border-b border-gray-100">
                        <span class="text-xs font-bold text-gray-500">${formatTgl}</span>
                        <span class="text-xs font-bold text-gray-900">${formatRupiah(data.total)}</span>
                    </div>
                    <div>${itemsHTML}</div>
                `;
                daftarRiwayatEl.appendChild(card);
            }
        }

        formPengeluaran.addEventListener('submit', (e) => {
            e.preventDefault();
            const nomStr = document.getElementById('nominal').value;
            const nominal = cleanNumber(nomStr);
            const ket = inputKeterangan.value;
            const tgl = document.getElementById('tanggal').value;

            if (nominal > 0) {
                expenses.push({ id: Date.now().toString(), nominal: nominal, keterangan: ket, tanggal: tgl });
                saveExpenses();
                document.getElementById('nominal').value = '';
                inputKeterangan.value = '';
                resetKategori();
            }
        });

        btnSetBudget.addEventListener('click', () => { formBudget.classList.toggle('hidden'); });

        btnSaveBudget.addEventListener('click', () => {
            const amount = cleanNumber(inputBudget.value);
            saveBudget(amount);
            inputBudget.value = '';
        });

        document.querySelectorAll('#nominal, #input-budget').forEach(input => {
            input.addEventListener('keyup', function() {
                let val = this.value.replace(/[^0-9]/g, '');
                if(val) { this.value = parseInt(val, 10).toLocaleString('id-ID'); } else { this.value = ''; }
            });
        });

        window.hapusPengeluaran = function(id) {
            if(confirm('Hapus pengeluaran ini?')) {
                expenses = expenses.filter(e => e.id !== id);
                saveExpenses();
            }
        }

        checkAuth();
    </script>
</body>
</html>
